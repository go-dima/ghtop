[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghtop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80,<1.0",
    "pyyaml>=6.0",
]

[project.scripts]
ghtop = "ghtop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ghtop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual>=0.80,<1.0",
]
